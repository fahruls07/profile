version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: resume_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: resume_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/resumedb
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: resume_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
