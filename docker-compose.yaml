version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: resume_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    container_name: resume_frontend
    expose:
      - "3000"

  backend:
    build: ./backend
    container_name: resume_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/resumedb
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: resume_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
